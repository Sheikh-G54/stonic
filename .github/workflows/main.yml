name: Build Stonic APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          mkdir -p /tmp/app
          cd /tmp/app
          flutter create --org com.example --project-name jarvis_app --platforms android .

      - name: Copy Stonic files
        run: |
          ls -la
          cp pubspec.yaml /tmp/app/pubspec.yaml
          rm -rf /tmp/app/test
          cp main.dart /tmp/app/lib/main.dart
          K=/tmp/app/android/app/src/main/kotlin/com/example/jarvis_app
          mkdir -p "$K"
          cp MainActivity.kt JarvisService.kt BootReceiver.kt "$K/"
          cp AndroidManifest.xml /tmp/app/android/app/src/main/AndroidManifest.xml

      - name: Set minSdk 24
        run: |
          cd /tmp/app/android/app
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' build.gradle*
          grep -n "minSdk" build.gradle*

      - name: Build APK
        run: |
          cd /tmp/app
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: stonic-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
